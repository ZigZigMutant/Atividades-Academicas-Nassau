<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar Plataforma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="conteiner">
        <div class="logo">

            <div >
                <img src="imagens/Garagem Logo.jpg" alt="Logo da Garagem do Perigo" class="logo-simbolo">
            </div>

        <div class="logo-texto"> 
            <span>Garagem</span>
            <span> do </span>
            <strong>Perigo</strong>
        </div>

        </div>
        <div>
            <h1>Entrar na sua conta</h1>

            <form >
                <label for="usuario">Usuário</label>
                <input 
                    type="text" 
                    id="usuario" 
                    placeholder="Digite seu e-mail ou usuário">

                <label for="senha">Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    placeholder="Digite sua senha">

                <a href="#" class="esqueci-senha">Esqueceu sua senha?</a>

                <button type="submit">Entrar</button>

            </form>

            <p class="cadastro">Não tem conta? <a href="#">Cadastre-se</a></p>

        </div>
    </div>
</body>
</html>
